# 推到 main 時建好打卡系統的 Docker 映像，放到 ghcr.io/doraeyi/zengji-punch:latest，
# VM 上的備援（deploy/backup）用它同步資料、緊急時開打卡系統。
name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/doraeyi/zengji-punch:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
